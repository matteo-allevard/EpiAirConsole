# One-command setup: `docker compose up`
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000" # real-time server
      - "5173:5173" # console
      - "5174:5174" # controller
    volumes:
      # Live reload: the source code on your machine is used inside the container…
      - .:/app
      # …but the dependencies installed in the image are kept.
      - /app/node_modules
      - /app/apps/server/node_modules
      - /app/apps/console/node_modules
      - /app/apps/controller/node_modules
